<style>
:root{--bg:#0b0f1d;--side:#0e1428;--card:#141b34;--line:#26335c;--ink:#e9eeff;--mute:#93a0c8;--violet:#8b5cf6;--cyan:#22d3ee;--rose:#fb7185;--ok:#34d399;--code:#060a18;--me:#2a2f6b}

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;display:flex;overflow:hidden}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

.newc{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:10px;font-weight:600}.newc:hover{border-color:var(--cyan)}
.chats{flex:1;overflow:auto;display:grid;gap:4px;align-content:start}
.ch{display:flex;align-items:center;gap:6px;border-radius:10px;padding:8px 10px;border:0;background:transparent;text-align:left;width:100%}.ch span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}.ch:hover,.ch.on{background:var(--card)}.ch .x{opacity:0;border:0;background:none;color:var(--mute);padding:0 4px}.ch:hover .x{opacity:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.burger{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px}
.logo{font-weight:800;font-size:1.2rem}.logo b{background:linear-gradient(90deg,var(--violet),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}

.row{display:flex;gap:12px}.row.me{justify-content:flex-end}
.av{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.78rem;flex:none}
.bub{min-width:0;max-width:100%}.me .bub{background:var(--me);padding:10px 15px;border-radius:18px 18px 4px 18px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.bot .bub{flex:1}.who{font-size:.76rem;font-weight:800;letter-spacing:.04em;color:var(--mute);margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.src{font-weight:600;letter-spacing:0;padding:1px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line)}.src.live{color:var(--ok);border-color:var(--ok)}
.md{word-wrap:break-word}.md p{margin:0 0 .8em}.md h1,.md h2,.md h3{margin:1em 0 .4em;line-height:1.3}.md h1{font-size:1.3rem}.md h2{font-size:1.15rem}.md h3{font-size:1.02rem}.md ul,.md ol{padding-left:1.3em;margin:0 0 .8em}.md li{margin:.15em 0}.md blockquote{margin:0 0 .8em;border-left:3px solid var(--violet);padding-left:12px;color:var(--mute)}.md a{color:var(--cyan)}
.md code.i{background:#8b5cf633;padding:1px 6px;border-radius:6px;font-family:"JetBrains Mono",monospace;font-size:.88em}
.cb{background:var(--code);border-radius:12px;margin:.6em 0 1em;overflow:hidden;border:1px solid var(--line)}.cb header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#ffffff10;font:600 .74rem "JetBrains Mono",monospace;color:#a9b6e0}.cb header button{border:0;background:none;color:#a9b6e0;font-size:.74rem}.cb header button:hover{color:var(--cyan)}.cb pre{margin:0;padding:12px;overflow-x:auto;font:.84rem/1.55 "JetBrains Mono",monospace;color:#d6e2ff}
.cursor::after{content:"▍";color:var(--cyan);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:var(--cyan);animation:b 1s infinite}.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}@keyframes b{50%{transform:translateY(-6px);opacity:.4}}
.acts{display:flex;gap:4px;margin-top:6px}.acts button{border:0;background:none;color:var(--mute);font-size:.76rem;padding:3px 8px;border-radius:8px}.acts button:hover{color:var(--cyan);background:#22d3ee1a}
.err{color:var(--rose)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;width:100%}.cmp .cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.dock{padding:8px 16px 14px}.box{width:min(780px,100%);margin:0 auto;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:8px 8px 8px 16px;display:flex;gap:8px;align-items:flex-end}.box:focus-within{border-color:var(--violet)}
textarea{flex:1;resize:none;max-height:180px;min-height:26px;font:inherit;color:var(--ink);background:transparent;border:0;padding:8px 0;outline:none}
.send{border:0;border-radius:14px;width:44px;height:44px;color:#fff;background:linear-gradient(135deg,var(--violet),var(--cyan));font-size:1.1rem;font-weight:800}.send:disabled{opacity:.4}.send.stop{background:var(--rose)}
.tools{width:min(780px,100%);margin:6px auto 0;display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--mute);align-items:center}.tb{border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 11px;font-size:.76rem}.tb[aria-pressed=true]{background:var(--cyan);color:#06222b;border-color:var(--cyan)}.tb:disabled{opacity:.4;cursor:not-allowed}
.note{width:min(780px,100%);margin:8px auto 0;text-align:center;font-size:.72rem;color:var(--mute)}
@media(max-width:820px){.side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s}.side.open{transform:none;box-shadow:0 0 60px #000a}.burger{display:block}.provs{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.box{padding-left:8px}
.atts{width:min(780px,100%);margin:0 auto 8px;display:flex;gap:8px;flex-wrap:wrap}.atts[hidden]{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 8px;font-size:.78rem;max-width:230px}.chip img{width:34px;height:34px;object-fit:cover;border-radius:8px}.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip button{border:0;background:none;color:var(--mute);font-size:1.1rem;line-height:1}.chip.pl{border-color:var(--violet)}
.plus{position:relative}.ib{width:40px;height:40px;border-radius:14px;border:0;background:transparent;font-size:1.15rem;display:grid;place-items:center;color:var(--mute);flex:none}.ib:hover{background:#8b5cf622;color:var(--ink)}.ib[aria-pressed=true]{background:var(--rose);color:#fff;animation:pulse 1.2s infinite}
.pop{position:absolute;bottom:48px;left:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;min-width:170px;box-shadow:0 12px 40px #0006;z-index:10}.pop[hidden]{display:none}.pop button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;font-size:.88rem}.pop button:hover{background:#8b5cf622}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}.ov[hidden]{display:none}.dlg{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(460px,100%);max-height:90dvh;overflow:auto}.dlg h2{margin:0 0 4px;font-size:1.1rem}.dlg p{margin:0;color:var(--mute);font-size:.85rem}.dlg video{width:100%;border-radius:12px;background:#000;max-height:60dvh;margin-top:10px}.row2{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.pbtn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;background:linear-gradient(135deg,var(--violet),var(--cyan));color:#fff}.gbtn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 16px}
.pi{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer}.pi input{margin-top:5px;width:18px;height:18px}.pi b{display:block}.pi small{display:block;color:var(--mute)}
.mat{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.mat img{width:64px;height:64px;object-fit:cover;border-radius:10px}.fchip{font-size:.78rem;background:#ffffff22;padding:3px 8px;border-radius:8px}.mtag{margin-top:6px;font-size:.72rem;opacity:.8}
.think{margin:2px 0 8px;border:1px dashed var(--line);border-radius:12px;padding:6px 12px;font-size:.88rem}.think summary{cursor:pointer;color:var(--mute);font-weight:600}.stg{margin-top:6px;font-size:.78rem;color:var(--mute)}
#toast{min-height:1.2em;color:var(--cyan)}@keyframes pulse{50%{box-shadow:0 0 0 6px #fb718544}}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="Riwayat percakapan"><a class="back" href="../../index.html#projects">&larr; Portofolio</a><button class="newc" id="newc">+ Percakapan baru</button><div class="chats" id="chats"></div></aside>
<div class="main">
  <div class="top"><button class="burger" id="burger" aria-label="Buka riwayat">&#9776;</button><span class="logo">Jer<b>AI</b></span><div class="provs" id="provs" role="group" aria-label="Pilih AI"></div></div>

</div>
<div class="ov" id="plugov" hidden role="dialog" aria-modal="true" aria-labelledby="plugt"><div class="dlg"><h2 id="plugt">&#129513; Plugin</h2><p>Alat tambahan yang dijalankan di browser sebelum pesan dikirim. Hasilnya diberikan ke AI sebagai konteks.</p><div id="plugl"></div><div class="row2"><button class="pbtn" id="plugok" type="button">Selesai</button></div></div></div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); }, P = window.PORTFOLIO || { projects: [], stats: [], inventory: [], profile: { bio: ['', ''] }, pkl: {}, config: {} }, C = P.config || {};
  var PV = [
    { id: 'claude', n: 'Claude', c: '#d97757', l: 'C', st: 'jelas, hangat, terstruktur, jujur soal batas pengetahuan' },
    { id: 'openai', n: 'ChatGPT', c: '#10a37f', l: 'G', st: 'ramah, membantu, dengan ringkasan poin dan langkah praktis' },
    { id: 'gemini', n: 'Gemini', c: '#4285f4', l: 'Ge', st: 'ringkas, seimbang, memakai judul kecil dan daftar' },
    { id: 'deepseek', n: 'DeepSeek', c: '#4d6bfe', l: 'D', st: 'analitis, menalar langkah demi langkah, teknis' },

    { id: 'grok', n: 'Grok', c: '#374151', l: 'X', st: 'langsung, santai, sedikit jenaka' }
  ];
  var KEY = 'jh-jerai-v3', st = { chats: [], cur: null }, prov = 'claude', mode = 'general', cmp = false, busy = false, avail = {}, abort = null, timer = null;
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pv(id) { return PV.filter(function (p) { return p.id === id; })[0] || { id: id, n: 'JerAI', c: '#64748b', l: 'J' }; }
  function load() { try { var v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && Array.isArray(v.chats)) st = v; } catch (e) { } }
  function save() { try { st.chats = st.chats.slice(0, 30); localStorage.setItem(KEY, JSON.stringify(st, function (k, v) { return k === 'imgs' ? undefined : v; })); } catch (e) { } }
  function chat() { var c = st.chats.filter(function (x) { return x.id === st.cur; })[0]; if (!c) { c = { id: 'c' + Date.now(), title: 'Percakapan baru', msgs: [] }; st.chats.unshift(c); st.cur = c.id; } return c; }

  /* ---------- markdown ringan ---------- */
  function inline(s) {
    s = esc(s).replace(/`([^`\n]+)`/g, '<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  }
  function md(t) {
    var parts = String(t).split(/```/), out = '';
    parts.forEach(function (seg, i) {
      if (i % 2) { var m = seg.match(/^([a-zA-Z0-9+#_-]*)\n?/), lang = m ? m[1] : '', code = seg.slice(m ? m[0].length : 0).replace(/\n$/, ''); out += '<div class="cb"><header><span>' + esc(lang || 'kode') + '</span><button type="button" data-copycode>Salin</button></header><pre><code>' + esc(code) + '</code></pre></div>'; return; }
      var lines = seg.split('\n'), html = '', list = null, para = [];
      function flushP() { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } }
      function flushL() { if (list) { html += '</' + list + '>'; list = null; } }
      lines.forEach(function (ln) {
        var h = ln.match(/^(#{1,3})\s+(.*)/), ul = ln.match(/^\s*[-*•]\s+(.*)/), ol = ln.match(/^\s*\d+[.)]\s+(.*)/), q = ln.match(/^>\s?(.*)/);
        if (h) { flushP(); flushL(); html += '<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'; }
        else if (ul || ol) { flushP(); var tag = ul ? 'ul' : 'ol'; if (list !== tag) { flushL(); html += '<' + tag + '>'; list = tag; } html += '<li>' + inline((ul || ol)[1]) + '</li>'; }
        else if (q) { flushP(); flushL(); html += '<blockquote>' + inline(q[1]) + '</blockquote>'; }
        else if (!ln.trim()) { flushP(); flushL(); }
        else { flushL(); para.push(ln); }
      });
      flushP(); flushL(); out += html;
    });
    return out;
  }

  /* ---------- mesin lokal (cadangan terakhir) ---------- */
  function norm(s) { return s.toLowerCase().replace(/[^a-z0-9+\-*/().,% ]/g, ' '); }
  function has(q, w) { return w.some(function (x) { return q.indexOf(x) >= 0; }); }
  function calc(q) { var m = q.match(/(?:hitung|berapa)\s*([\d+\-*/().,%\s]+)/); if (!m) return null; var e = m[1].replace(/,/g, '.').replace(/%/g, '/100').trim(); if (!/^[\d+\-*/().\s]+$/.test(e) || !/\d/.test(e)) return null; try { var v = Function('"use strict";return (' + e + ')')(); return isFinite(v) ? 'Hasilnya **' + Math.round(v * 1e6) / 1e6 + '**.' : 'Hasilnya tidak terhingga.'; } catch (x) { return null; } }
  var KB = [
    [['html'], 'Contoh halaman HTML dasar:\n```html\n<!DOCTYPE html>\n<html lang="id">\n<head>\n  <meta charset="UTF-8">\n  <title>Halo</title>\n</head>\n<body>\n  <h1>Halo, dunia!</h1>\n  <p>Ini halaman pertamaku.</p>\n</body>\n</html>\n```\nSimpan sebagai `index.html` lalu buka di browser.'],
    [['javascript', 'js '], 'Contoh fungsi JavaScript:\n```js\nfunction jumlah(a, b) {\n  return a + b;\n}\nconsole.log(jumlah(2, 3)); // 5\n```\nPakai `const`/`let`, fungsi panah `(a,b)=>a+b`, dan `fetch()` untuk memanggil API.'],
    [['python'], 'Contoh Python:\n```python\nfor i in range(1, 6):\n    print(i * i)\n```\nPython memakai indentasi untuk blok kode. Daftar: `[1,2,3]`, kamus: `{"a":1}`.'],
    [['php'], 'Contoh PHP:\n```php\n<?php\n$nama = "Budi";\necho "Halo, $nama!";\n```\nPHP berjalan di server; untuk database pakai PDO dengan prepared statement.'],
    [['sql', 'mysql', 'database'], 'Contoh SQL:\n```sql\nSELECT nama, harga FROM produk WHERE harga > 10000 ORDER BY harga DESC;\n```\nGunakan prepared statement agar aman dari SQL injection.'],
    [['css'], 'Contoh CSS flexbox:\n```css\n.row { display: flex; gap: 12px; align-items: center; }\n```\nUntuk tata letak dua dimensi pakai `display: grid`.'],
    [['git', 'github'], 'Alur dasar Git:\n```bash\ngit init\ngit add .\ngit commit -m "pesan"\ngit branch -M main\ngit remote add origin URL\ngit push -u origin main\n```'],

  $('#atts').addEventListener('click', function (e) { var b = e.target.closest('[data-rm]'); if (!b) return; att.splice(+b.dataset.rm, 1); drawAtts(); });

  /* menu + */
  function popClose() { $('#pop').hidden = true; $('#plus').setAttribute('aria-expanded', 'false'); }
  $('#plus').onclick = function (e) { e.stopPropagation(); var h = $('#pop').hidden; $('#pop').hidden = !h; this.setAttribute('aria-expanded', h); if (h) $('#pop button').focus(); };
  document.addEventListener('click', function (e) { if (!e.target.closest('.plus')) popClose(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { popClose(); closeCam(); $('#plugov').hidden = true; } });
  $('#pop').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return; popClose(); var a = b.dataset.a;
    if (a === 'cam') openCam(); else if (a === 'photo') $('#fPhoto').click(); else if (a === 'file') $('#fFile').click(); else if (a === 'plug') openPlug();
  });

  /* kamera */
  async function openCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#fCam').click(); return; }
    try { stopStream(); stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false }); $('#vid').srcObject = stream; $('#camov').hidden = false; $('#shot').focus(); }
    catch (e) { toast('Kamera tidak bisa dibuka (' + (e.name === 'NotAllowedError' ? 'izin ditolak' : 'tidak tersedia') + '). Memakai pemilih foto.'); $('#fCam').click(); }
  }
  function stopStream() { if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } }
  function closeCam() { stopStream(); $('#vid').srcObject = null; $('#camov').hidden = true; }
  $('#camx').onclick = closeCam;
  $('#flip').onclick = function () { facing = facing === 'environment' ? 'user' : 'environment'; openCam(); };
  $('#shot').onclick = function () {
    var v = $('#vid'); if (!v.videoWidth) { toast('Kamera belum siap.'); return; }
    if (att.length >= MAXA) { toast('Maksimal ' + MAXA + ' lampiran per pesan.'); return; }
    att.push({ kind: 'image', name: 'kamera-' + new Date().toISOString().slice(11, 19).replace(/:/g, '') + '.jpg', data: shrink(v, v.videoWidth, v.videoHeight, 1280, .78), thumb: shrink(v, v.videoWidth, v.videoHeight, 96, .6) });
    drawAtts(); closeCam(); q.focus();
  };

  /* mikrofon (pengenalan suara bawaan browser) */
  $('#mic').onclick = function () {
    if (!SR) { toast('Peramban ini belum mendukung input suara. Coba Chrome, Edge, atau Safari terbaru.'); return; }
    if (listening && rec) { rec.stop(); return; }
    var btn = this, base = q.value ? q.value.trim() + ' ' : ''; rec = new SR(); rec.lang = 'id-ID'; rec.interimResults = true; rec.continuous = true;
    rec.onstart = function () { listening = true; btn.setAttribute('aria-pressed', 'true'); toast('Mendengarkan… bicara sekarang. Tekan mikrofon lagi untuk berhenti.'); };
    rec.onresult = function (e) { var t = ''; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; q.value = (base + t).slice(0, 4000); grow(); };
    rec.onerror = function (e) { toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? 'Izin mikrofon ditolak.' : e.error === 'no-speech' ? 'Tidak ada suara terdengar.' : 'Mikrofon bermasalah: ' + e.error); };
    rec.onend = function () { listening = false; btn.setAttribute('aria-pressed', 'false'); q.focus(); };
    try { rec.start(); } catch (e) { toast('Mikrofon tidak bisa dimulai.'); }
  };

  /* berpikir lebih keras */
  $('#think').onclick = function () { thinkOn = !thinkOn; this.setAttribute('aria-pressed', thinkOn); toast(thinkOn ? 'Think harder aktif: jawaban dibuat dua tahap (menalar, lalu diperiksa ulang). Lebih lambat tapi lebih teliti.' : 'Think harder dimatikan.'); };

  /* plugin */
  function tmo(p, ms) { return Promise.race([p, new Promise(function (_, rj) { setTimeout(function () { rj(new Error('waktu habis')); }, ms); })]); }
  function getJSON(u) { return fetch(u).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); }); }
  var PLUG = {
    waktu: { n: 'Tanggal & waktu', d: 'Memberi tahu AI tanggal, jam, dan zona waktu kamu sekarang.', run: function () { return Promise.resolve('Waktu sekarang di perangkat pengguna: ' + new Date().toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short' }) + ' (zona ' + Intl.DateTimeFormat().resolvedOptions().timeZone + ').'); } },
    kalkulator: { n: 'Kalkulator', d: 'Menghitung ekspresi matematika di pesanmu secara akurat (angka dan + - * / ( ) % ^).', run: function (t) {
      var m = t.replace(/,/g, '.').match(/\d[\d+\-*/().%^\s]*[\d)]/); if (!m) return Promise.resolve(null);
      var e = m[0].replace(/\^/g, '**').replace(/(\d+(?:\.\d+)?)%/g, '($1/100)'); if (!/[+\-*/%]/.test(e) || !/^[\d+\-*/().\s*]+$/.test(e)) return Promise.resolve(null);
      try { var v = Function('"use strict";return (' + e + ')')(); return Promise.resolve(isFinite(v) ? 'Hasil kalkulator untuk "' + m[0].trim() + '" = ' + Math.round(v * 1e8) / 1e8 : null); } catch (x) { return Promise.resolve(null); } } },
    wikipedia: { n: 'Wikipedia', d: 'Mencari ringkasan artikel Wikipedia Indonesia yang relevan dengan pertanyaanmu.', run: function (t) {
      var qq = t.replace(/[?!.]+$/, '').slice(0, 120);
      return getJSON('https://id.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch=' + encodeURIComponent(qq)).then(function (j) {
        var h = j.query && j.query.search && j.query.search[0]; if (!h) return null;
        return getJSON('https://id.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(h.title.replace(/ /g, '_'))).then(function (s) { return s.extract ? 'Ringkasan Wikipedia "' + s.title + '": ' + s.extract + ' (Sumber: ' + ((s.content_urls && s.content_urls.desktop && s.content_urls.desktop.page) || 'id.wikipedia.org') + ')' : null; }); }); } },
    cuaca: { n: 'Cuaca', d: 'Mengambil cuaca terkini di lokasimu (Open-Meteo) bila pesan menyinggung cuaca. Meminta izin lokasi.', run: function (t) {
      if (!/cuaca|hujan|suhu|panas|dingin|angin|lembap|mendung/i.test(t) || !navigator.geolocation) return Promise.resolve(null);
      return new Promise(function (res, rej) { navigator.geolocation.getCurrentPosition(res, rej, { timeout: 7000 }); }).then(function (p) {
        return getJSON('https://api.open-meteo.com/v1/forecast?current=temperature_2m,relative_humidity_2m,wind_speed_10m,precipitation&timezone=auto&latitude=' + p.coords.latitude.toFixed(2) + '&longitude=' + p.coords.longitude.toFixed(2)).then(function (j) { var c = j.current; return c ? 'Cuaca terkini di lokasi pengguna: suhu ' + c.temperature_2m + '°C, kelembapan ' + c.relative_humidity_2m + '%, angin ' + c.wind_speed_10m + ' km/j, curah hujan ' + c.precipitation + ' mm (sumber: Open-Meteo).' : null; }); }); } },
    portofolio: { n: 'Data portofolio', d: 'Memberi AI daftar proyek dan skill Jeremy dari portofolio ini.', run: function () { return Promise.resolve('Data portofolio Jeremy Hidayat. Proyek: ' + P.projects.map(function (p) { return p.title; }).join('; ') + '. Skill: ' + P.stats.map(function (s) { return s.name + ' ' + s.value + '/100'; }).join(', ') + '.'); } }
  };
  async function runPlugins(text) {
    var keys = Object.keys(PLUG).filter(function (k) { return plug[k]; }); if (!keys.length) return { ctx: '', used: [] };
    stage('Menjalankan plugin…'); var out = [], used = [];
    for (var i = 0; i < keys.length; i++) { try { var r = await tmo(PLUG[keys[i]].run(text), 8000); if (r) { out.push('[Plugin ' + PLUG[keys[i]].n + '] ' + r); used.push(PLUG[keys[i]].n); } } catch (e) { toast('Plugin ' + PLUG[keys[i]].n + ' gagal: ' + e.message); } }
    return { ctx: out.length ? 'Konteks dari plugin (gunakan bila relevan, sebutkan sumbernya):\n' + out.join('\n') : '', used: used };
  }
  function openPlug() {
    $('#plugl').innerHTML = Object.keys(PLUG).map(function (k) { return '<label class="pi"><input type="checkbox" data-pk="' + k + '"' + (plug[k] ? ' checked' : '') + '><span><b>' + esc(PLUG[k].n) + '</b><small>' + esc(PLUG[k].d) + '</small></span></label>'; }).join('');
    $('#plugov').hidden = false; $('#plugok').focus();
  }
  $('#plugl').addEventListener('change', function (e) { var k = e.target.dataset.pk; if (!k) return; plug[k] = e.target.checked; try { localStorage.setItem('jh-jerai-plug', JSON.stringify(plug)); } catch (x) { } drawAtts(); });
  $('#plugok').onclick = function () { $('#plugov').hidden = true; q.focus(); };
  drawAtts();

  load(); chat(); drawProvs(); paint();
  fetch('/api/chat').then(function (r) { return r.ok ? r.json() : Promise.reject(); }).then(function (j) { Object.keys(j.providers || {}).forEach(function (k) { avail[k] = !!j.providers[k]; }); var first = PV.filter(function (p) { return avail[p.id]; })[0]; if (first) prov = first.id; drawProvs(); }).catch(function () { drawProvs(); });
  window.__jerai = { md: md, local: local };
})();
</script>
</body>
