<!DOCTYPE html>
<html lang="id" data-theme="night">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Digital | Jeremy Hidayat</title>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../_shared/shared.css">

</head>
<body data-title="Absensi Digital">
<main class="app">

<h1>Absensi Digital</h1>
<section class="box"><div class="row"><label>Tanggal <input type="date" id="d"></label><input id="n" placeholder="Tambah nama siswa" maxlength="40" aria-label="Nama siswa"><button class="btn btn-sm gold" id="add">Tambah</button><button class="btn btn-sm" id="all">Semua hadir</button><button class="btn btn-sm" id="csv">Unduh CSV</button></div>
<p class="muted" id="sum" style="margin-top:10px"></p><input id="fq" type="search" placeholder="Cari siswa" maxlength="40" aria-label="Cari siswa" style="margin-top:8px"></section>
<section class="box"><ul id="ls"></ul></section>
</main>
<script src="../_shared/shared.js"></script>
<script>

var ST=['Hadir','Izin','Sakit','Alpa'],K='jh-absen';
var db=load(K,{names:['Andi','Budi','Citra','Dewi','Eko','Fajar','Gita','Hana','Irfan','Joko'],rec:{}});
var d=$('#d');d.value=new Date().toISOString().slice(0,10);
function pctOf(n){var t=0,h=0;Object.keys(db.rec).forEach(function(k){var v=db.rec[k][n];if(v){t++;if(v==='Hadir')h++}});return t?Math.round(h*100/t):null}
function R(){return db.rec[d.value]=db.rec[d.value]||{}}
function render(){var r=R(),c={Hadir:0,Izin:0,Sakit:0,Alpa:0,Belum:0};
  var fq=($('#fq').value||'').toLowerCase();db.names.forEach(function(n){c[r[n]||'Belum']++});$('#ls').innerHTML=db.names.map(function(n,i){var s=r[n];if(fq&&n.toLowerCase().indexOf(fq)<0)return '';var pct=pctOf(n);return '<li class="row" style="justify-content:space-between;padding:8px 0;border-bottom:4px dotted var(--muted)"><span>'+esc(n)+(pct===null?'':' <span class="muted">('+pct+'% hadir)</span>')+'</span><span>'+ST.map(function(x){return '<button class="btn btn-sm'+(s===x?' gold':'')+'" data-i="'+i+'" data-s="'+x+'" aria-pressed="'+(s===x)+'">'+x[0]+'</button>'}).join('')+'<button class="btn btn-sm pink" data-del="'+i+'" aria-label="Hapus '+esc(n)+'">&#10005;</button></span></li>'}).join('')||'<li class="muted">Belum ada siswa. Tambahkan namanya di atas.</li>';
  $('#sum').textContent='Hadir '+c.Hadir+' | Izin '+c.Izin+' | Sakit '+c.Sakit+' | Alpa '+c.Alpa+' | Belum diisi '+c.Belum+'. H=Hadir, I=Izin, S=Sakit, A=Alpa.';save(K,db)}
$('#ls').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.s){var n=db.names[+b.dataset.i];R()[n]=b.dataset.s;render()}
  if(b.dataset.del){var n2=db.names.splice(+b.dataset.del,1)[0];Object.keys(db.rec).forEach(function(k){delete db.rec[k][n2]});render()}});
$('#add').addEventListener('click',function(){var v=$('#n').value.trim();if(!v)return;if(db.names.indexOf(v)>=0){toast('Nama sudah ada');return}db.names.push(v);$('#n').value='';render()});
d.addEventListener('change',render);
$('#fq').addEventListener('input',render);
$('#all').addEventListener('click',function(){var r=R();db.names.forEach(function(n){r[n]='Hadir'});render();toast('Semua siswa ditandai hadir')});
$('#csv').addEventListener('click',function(){var rows=['Nama,Tanggal,Status'];Object.keys(db.rec).sort().forEach(function(t){db.names.forEach(function(n){if(db.rec[t][n])rows.push('"'+n.replace(/"/g,'""')+'",'+t+','+db.rec[t][n])})});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='rekap-absensi.csv';a.click();toast('Rekap diunduh')});
render();
</script>
</body></html>
