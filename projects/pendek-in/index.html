<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pendek.in · Pemendek URL</title><meta name="description" content="Pendek.in: pemendek URL dengan Node.js, Express, PostgreSQL, dan Tailwind CSS. Proyek portofolio Jeremy Hidayat.">
  <meta name="theme-color" content="#0d9488"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="mx-auto max-w-3xl px-4 py-10">
  <header class="mb-8 text-center">
    <h1 class="text-4xl font-extrabold tracking-tight"><span class="text-teal-600 dark:text-teal-400">Pendek</span>.in 🔗</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-400">Pendekkan tautan panjang, bagikan, dan pantau jumlah klik. Node.js + Express + PostgreSQL + Tailwind CSS.</p>
    <p id="mode" class="mt-3 hidden rounded-2xl bg-amber-500/10 p-3 text-sm text-amber-700 dark:text-amber-300"></p>
  </header>
  <form id="form" class="card space-y-3" novalidate>
    <label class="block text-sm font-semibold">URL panjang<input id="url" class="input mt-1" type="url" placeholder="https://contoh.com/artikel/yang/sangat/panjang" required autocomplete="off"></label>
    <label class="block text-sm font-semibold">Alias kustom (opsional)<input id="slug" class="input mt-1" placeholder="mis. proyek-saya" maxlength="32" autocomplete="off"></label>
    <p id="error" class="hidden text-sm text-rose-600" role="alert"></p>
    <button class="btn w-full" id="submit">Pendekkan</button>
  </form>
  <section id="result" class="card mt-4 hidden" aria-live="polite"></section>
  <section class="mt-8"><h2 class="mb-3 text-lg font-bold">Tautan terbaru</h2><ul id="list" class="space-y-2"></ul><p id="empty" class="hidden py-6 text-center text-sm text-slate-500">Belum ada tautan.</p></section>
  <footer class="mt-10 text-center text-xs text-slate-500">Proyek portofolio Jeremy Hidayat</footer>
</main>
<script src="./app.js" type="module"></script>
</body>
</html>
